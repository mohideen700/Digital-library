<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="container">

    <div class="card">

        <div class="logo">
            <img src="../assets/open-book-abstract-minimalism-flat-logo-vector-art_943281-71681-Photoroom.png"
                 alt="Library Logo">
            <p id="subtitle">Welcome back</p>
        </div>

        <form id="loginForm">

            <h2>Login</h2>
            <div id="loginMessage" class="message" aria-live="polite"></div>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <select id="loginRole" required>
                <option value="">Select Role</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>

            <button type="submit" class="submitBtn">
                Login
            </button>

            <p class="register-link">
                Don't have an account?
                <a href="#" onclick="showRegister()">Register Here</a>
            </p>

        
        </form>


        <form id="registerForm" style="display: none;">

            <h2>Create Account</h2>
            <div id="registerMessage" class="message" aria-live="polite"></div>

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                id="registerPhone"
                placeholder="Phone Number"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                required
            >

            <select id="registerRole" required>
                <option value="">Select Role</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>

            <button type="submit" class="submitBtn">
                Register
            </button>

            <p class="register-link">
                Already registered?
                <a href="#" onclick="showLogin(); return false;">Login Here</a>
            </p>

        </form>

    </div>

</div>


<script src= "../js/login.js"></script>

</body>
</html>
